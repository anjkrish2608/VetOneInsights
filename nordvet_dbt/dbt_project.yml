# Nordvet no-show models: raw (loaded by Python) -> staging -> marts.
# Run from the repo root:  dbt build --project-dir nordvet_dbt --profiles-dir nordvet_dbt
name: nordvet
version: "1.0.0"
profile: nordvet

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Metric settings (D-settled, D-ranking-window). Change here, not in the SQL.
  unsettled_days: 3          # the last 3 days are unsettled: no-shows are recorded late
  ranking_window_days: 28    # recent ranking window, counted back from the newest settled day
  # as_of_date: "2026-11-09" # optional; default is today in Copenhagen (D-as-of)

flags:
  send_anonymous_usage_stats: false  # client data project: no telemetry

models:
  nordvet:
    staging:
      +materialized: view   # thin cleanup layer; always reflects the latest raw rows
    marts:
      +materialized: table  # what Power BI / Mette reads; built once per run
