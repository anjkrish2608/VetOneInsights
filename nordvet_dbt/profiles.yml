# Local DuckDB only; no credentials (D-profiles).
# The path is the same DUCKDB_PATH the Python ingestion uses. It is relative to the
# directory dbt is run from, so run dbt from the repo root (run_pipeline.py does).
nordvet:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/nordvet.duckdb') }}"
      threads: 1
